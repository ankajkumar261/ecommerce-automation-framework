# Place at: src/test/resources/allure.properties
# Makes @Issue("BOUT-123") render as a clickable link in the Allure report.
# Change the base URL to your real bug tracker (Jira shown as an example).
allure.results.directory=target/allure-results
allure.link.issue.pattern=https://issue-tracker.example.test/browse/{}
allure.link.tms.pattern=https://issue-tracker.example.test/browse/{}